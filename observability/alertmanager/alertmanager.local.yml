route:
  receiver: alert-sink
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname]

receivers:
  # alert-sink prints every notification: `docker compose logs -f alert-sink`
  - name: alert-sink
    webhook_configs:
      - url: http://alert-sink:8080/
        send_resolved: true
