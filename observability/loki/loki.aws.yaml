# Started with -config.expand-env=true, so ${VAR} is read from the task environment.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  # Single binary: bind the ring to loopback (Fargate's ENI is not eth0).
  instance_addr: 127.0.0.1
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      bucketnames: ${LOKI_S3_BUCKET}
      region: ${AWS_REGION}

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

analytics:
  reporting_enabled: false
