# In AWS every ECS service registers in the Cloud Map namespace
# "referrals.internal" (var.discovery_namespace in Terraform). Prometheus finds
# all API tasks through the DNS A records, so autoscaling needs no config change.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: staging

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - dns_sd_configs:
        - names: ["alertmanager.referrals.internal"]
          type: A
          port: 9093

scrape_configs:
  - job_name: referrals-api
    dns_sd_configs:
      - names: ["api.referrals.internal"]
        type: A
        port: 8000
        refresh_interval: 30s
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    dns_sd_configs:
      - names: ["alertmanager.referrals.internal"]
        type: A
        port: 9093
  - job_name: loki
    dns_sd_configs:
      - names: ["loki.referrals.internal"]
        type: A
        port: 3100
