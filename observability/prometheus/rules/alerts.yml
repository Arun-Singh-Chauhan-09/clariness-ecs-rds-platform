groups:
  - name: referrals-api
    rules:
      - alert: ApiTargetDown
        expr: up{job="referrals-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "An API task is not answering Prometheus scrapes"
          runbook: "docs/runbooks/incident-response.md#apitargetdown"

      - alert: ApiNoTargets
        expr: absent(up{job="referrals-api"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No API tasks discovered at all"
          runbook: "docs/runbooks/incident-response.md#apinotargets"

      - alert: ApiHigh5xxRate
        expr: |
          sum(rate(http_requests_total{job="referrals-api", status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="referrals-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of API requests are failing with 5xx"
          runbook: "docs/runbooks/incident-response.md#apihigh5xxrate"

      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="referrals-api"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 500 ms"
          runbook: "docs/runbooks/incident-response.md#apihighlatencyp95"

      - alert: ApiDatabaseUnreachable
        expr: min(db_up{job="referrals-api"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "At least one API task cannot reach the database"
          runbook: "docs/runbooks/incident-response.md#apidatabaseunreachable"

      - alert: DbPoolSaturated
        expr: |
          max by (instance) (db_pool_checked_out{job="referrals-api"} / db_pool_size{job="referrals-api"}) >= 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An API task has used 90% or more of its DB connection pool for 5 minutes"
          runbook: "docs/runbooks/incident-response.md#dbpoolsaturated"

  - name: observability
    rules:
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki is down; app logs still reach CloudWatch"
          runbook: "docs/runbooks/incident-response.md#lokidown"
