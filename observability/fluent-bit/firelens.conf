# Loaded by FireLens (config-file-type=file). Every app log line goes to BOTH
# Loki (for Grafana) and CloudWatch (so logs survive if Loki is down).
[OUTPUT]
    Name        loki
    Match       *
    Host        ${LOKI_HOST}
    Port        3100
    Labels      job=referrals-api, env=${ENVIRONMENT}
    Label_keys  $container_name
    Line_format json
    Retry_Limit 5

[OUTPUT]
    Name              cloudwatch_logs
    Match             *
    region            ${AWS_REGION}
    log_group_name    ${APP_LOG_GROUP}
    log_stream_prefix app/
    auto_create_group false
