# Local docker compose: the API container uses the fluentd log driver to send
# logs here; Fluent Bit forwards them to Loki, as FireLens does in AWS.
[SERVICE]
    Flush     1
    Log_Level info

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100
    Labels      job=referrals-api, env=local
    Label_keys  $container_name
    Line_format json
