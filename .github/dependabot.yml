# Weekly dependency updates as pull requests. Every PR goes through the full CI
# (tests, Trivy, Checkov), so an update is only merged when it is proven safe.
# Minor and patch updates are grouped. Major versions (Terraform AWS provider 6,
# Prometheus 3, Grafana 13, ...) change behaviour and are upgraded on purpose,
# one at a time, so Dependabot does not open PRs for them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /app
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /app
      - /observability/prometheus
      - /observability/alertmanager
      - /observability/loki
      - /observability/grafana
      - /observability/fluent-bit
    schedule: { interval: weekly }
    groups:
      base-images: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/staging
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
