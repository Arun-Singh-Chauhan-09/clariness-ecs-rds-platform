# Weekly dependency updates as pull requests. Every PR goes through the full CI
# (tests, Trivy, Checkov), so an update is only merged when it is proven safe.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /app
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /app
      - /observability/prometheus
      - /observability/alertmanager
      - /observability/loki
      - /observability/grafana
      - /observability/fluent-bit
    schedule: { interval: weekly }

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/staging
    schedule: { interval: weekly }
