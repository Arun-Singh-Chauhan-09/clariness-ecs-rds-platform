name: drift-detection

# The part of GitOps that ArgoCD would give us on Kubernetes: compare the real
# environment with what git says, every day, and open an issue on drift
# (e.g. someone changed a security group in the console).
on:
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  drift:
    # Skipped until the AWS side is set up (bootstrap + repo variables), so the
    # repo doesn't show a red run for every push before an AWS account is wired in.
    if: ${{ vars.AWS_REGION != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/staging
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Plan against the running image (exit code 2 = drift)
        id: plan
        run: |
          TAG="$(../../../scripts/current-image-tag.sh)"
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode \
            -var "image_tag=$TAG" -var "alert_email=${{ vars.ALERT_EMAIL }}" > plan.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Open an issue on drift
        if: steps.plan.outputs.exit == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Drift detected in staging on $(date -u +%F)."; echo; echo '```'; grep -E '^\s*[~+-/]|^Plan:' plan.txt | tail -c 60000; echo '```'; } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Infrastructure drift detected ($(date -u +%F))" --body-file body.md
      - if: steps.plan.outputs.exit == '1'
        run: cat plan.txt && exit 1
